# GPT-OSS 120B: only schedules when >= 80GB VRAM (nvidia.com/gpu.product).
# Default for < 80GB VRAM is OSS-20B (gpt-oss-20b-inference-service).
vllmInferenceService:
  annotations:
    openshift.io/display-name: gpt-oss-120b-inference
    serving.kserve.io/deploymentMode: RawDeployment
    argocd.argoproj.io/sync-wave: "10"

  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: nvidia.com/gpu.present
                  operator: In
                  values: ["true"]
                # >= 80GB VRAM (e.g. H100 80GB, H200 141GB); add more products as needed
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                    - NVIDIA-H100-80GB-HBM3
                    - NVIDIA-H100-80GB
                    - NVIDIA-H100
                    - NVIDIA-H200-141GB-HBM3
                    - NVIDIA-H200-141GB
                    - NVIDIA-H200

vllmServingRuntime:
  annotations:
    opendatahub.io/accelerator-name: nvidia-gpu
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: gpt-oss-120b-inference
    argocd.argoproj.io/sync-wave: "5"

  model: openai/gpt-oss-120b

acceleratorProfile:
  enabled: false
