clusterGroup:
  name: prod

  namespaces:
    - rag-llm-sno
    - openshift-nfd
    - nvidia-gpu-operator
    - cert-manager-operator  # cert-manager Operator for Red Hat OpenShift
    # Single OG here — do not duplicate (e.g. avoid bootstrap script also creating an OG in this ns).
    - redhat-ods-operator:
        operatorGroup: true
        targetNamespaces: []
    # Serverless/Service Mesh: install via Operator Hub BEFORE this pattern (see README) to avoid
    # "intersecting operatorgroups provide the same apis" with OpenShift AI. Namespace only:
    - openshift-serverless
    - openshift-storage:
        operatorGroup: true
        targetNamespaces:
          - openshift-storage
    - openshift-pipelines
    - redhat-ods-applications
    - rhoai-model-registries
    - rhods-notebooks

  # Operator Subscriptions: no sync-waves here — staggered waves caused rhods-operator to never
  # appear when an earlier operator (e.g. cert-manager) stayed Progressing. All apply in parallel.
  # Application-level waves still order DSC after charts. See docs/SYNC-WAVES.md
  subscriptions:
    rhoai:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: fast-3.x  # OpenShift AI 3.x
    certmanager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      source: redhat-operators
      channel: stable-v1
    # servicemesh + serverless removed — install from Operator Hub first (RHOAI KServe prereq).
    # See README "Prerequisites" and docs/OPERATORGROUP-INTERSECTING.md
    nfd:
      name: nfd
      namespace: openshift-nfd
    # Red Hat Certified Operator only; do not use community-operators (gpu-operator)
    nvidia:
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      source: certified-operators
    lvms:
      name: lvms-operator
      namespace: openshift-storage

  # Argo CD Application sync order (coarse). Resource-level waves inside charts refine ordering.
  applications:
    nfd:
      name: nfd
      namespace: openshift-nfd
      path: charts/nfd
      annotations:
        argocd.argoproj.io/sync-wave: "10"

    lvms:
      name: lvms
      namespace: openshift-storage
      path: charts/lvms
      annotations:
        argocd.argoproj.io/sync-wave: "15"

    nvidia-config:
      name: nvidia-config
      namespace: nvidia-gpu-operator
      path: charts/nvidia-config
      annotations:
        argocd.argoproj.io/sync-wave: "20"

    dsc:
      name: dsc
      namespace: rag-llm-sno
      path: charts/dsc
      annotations:
        argocd.argoproj.io/sync-wave: "30"

    granite-inference-service:
      name: granite-inference-service
      namespace: rag-llm-sno
      path: charts/vllm-inference-service
      extraValueFiles:
        - $patternref/overrides/granite-inference-service-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "40"

    gemma2-inference-service:
      name: gemma2-inference-service
      namespace: rag-llm-sno
      path: charts/vllm-inference-service
      extraValueFiles:
        - $patternref/overrides/gemma2-inference-service-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "42"

    gpt-oss-20b-inference-service:
      name: gpt-oss-20b-inference-service
      namespace: rag-llm-sno
      path: charts/vllm-inference-service
      extraValueFiles:
        - $patternref/overrides/gpt-oss-20b-inference-service-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "44"

    gpt-oss-inference-service:
      name: gpt-oss-inference-service
      namespace: rag-llm-sno
      path: charts/vllm-inference-service
      extraValueFiles:
        - $patternref/overrides/gpt-oss-inference-service-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "46"

    llamastack:
      name: llamastack
      namespace: rag-llm-sno
      path: charts/llamastack
      annotations:
        argocd.argoproj.io/sync-wave: "50"

    rag-llm-frontend:
      name: rag-llm-frontend
      namespace: rag-llm-sno
      repoURL: https://github.com/validatedpatterns-sandbox/rag-llm-demo-ui
      chartVersion: main
      path: helm
      extraValueFiles:
        - $patternref/overrides/rag-llm-frontend-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "55"

    openwebui:
      name: openwebui
      namespace: rag-llm-sno
      repoURL: https://github.com/open-webui/helm-charts
      chartVersion: main
      path: charts/open-webui
      extraValueFiles:
        - $patternref/overrides/openwebui-values.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "56"
